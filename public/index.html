<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zense Multiplayer Game of Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700&family=Geologica:wght@400;600;700&family=Tektur:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #000814;
            --bg-panel: rgba(0, 8, 20, 0.85);
            --bg-element: #004E89;
            --bg-hover: #00A6FB;
            --border-color: rgba(211, 211, 211, 0.15);
            --border-focus: #00A6FB;
            --text-primary: #F8F9FA;
            --text-secondary: #D3D3D3;
            --text-muted: #8892b0;
            
            --accent-green: #26FEC3;
            --accent-green-hover: #25A18E;
            --accent-blue: #00A6FB;
            --accent-blue-hover: #004E89;
            --accent-red: #D81159;
            --accent-red-hover: #9B2226;
            --accent-amber: #FFBA08;
            --accent-indigo: #3D348B;
            --accent-orange: #FF6B35;
            --accent-lavender: #C0C1F7;

            --comp-green: #208B3A;
            --comp-purple: #5603AD;
            --comp-blue: #023E8A;
            --comp-magenta: #B5179E;
            --comp-red: #9B2226;
            --comp-orange: #FB8500;
        }

        body {
            font-family: 'Chivo', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 166, 251, 0.20), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(61, 52, 139, 0.28), transparent 50%),
                var(--bg-main);
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-indigo) 55%, var(--bg-element) 100%);

        .app-header,
        .workspace {
            position: relative;
            z-index: 1;
        }

        .app-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            padding: 0 4px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-family: 'Geologica', system-ui, -apple-system, sans-serif;
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #F8F9FA 0%, #00A6FB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .app-logo {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            color: var(--accent-blue);
            filter: drop-shadow(0 0 6px rgba(0, 166, 251, 0.6));
        }

        .app-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .workspace {
            display: flex;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: stretch;
            flex-wrap: nowrap;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 320px;
            max-width: 840px;
        }

        .settings-card {
            background: linear-gradient(180deg, rgba(0, 8, 20, 0.95) 0%, rgba(0, 4, 10, 0.98) 100%);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            width: 270px;
            flex-shrink: 0;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .settings-header {
            font-family: 'Geologica', system-ui, sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-item {
            background: rgba(0, 78, 137, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .setting-label {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-value-badge {
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .setting-control-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item select {
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            width: 100%;
            cursor: pointer;
            font-family: 'Chivo', system-ui, sans-serif;
        }

        .setting-item input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-main);
            border-radius: 3px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin: 4px 0;
            cursor: pointer;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 166, 251, 0.6);
        }

        .turn-badge {
            background: var(--bg-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        #stats {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .stat-item span {
            color: var(--text-primary);
            font-weight: 700;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            background: var(--bg-element);
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Chivo', system-ui, sans-serif;
        }

        button:hover {
            background: var(--bg-hover);
            color: var(--bg-main);
        }

        #startBtn { background: var(--accent-green); color: var(--bg-main); border-color: transparent; }
        #nextTurnBtn { background: var(--accent-blue); color: var(--bg-main); border-color: transparent; }
        #clearBtn { background: var(--accent-red); border-color: transparent; }
        
        .tools-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 78, 137, 0.2);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .color-btn {
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .color-btn.active {
            border-color: #F8F9FA;
            box-shadow: 0 0 8px rgba(248, 249, 250, 0.8);
        }

        #eraserBtn {
            background: rgba(211, 211, 211, 0.1);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        #eraserBtn.active {
            border-color: #F8F9FA;
            background: var(--accent-indigo);
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #00040A;
            border-radius: 10px;
            cursor: crosshair;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Room Entry Overlay -->
    <div id="room-overlay" style="position:fixed; inset:0; background:rgba(0,8,20,0.95); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
        <h2 style="color:var(--accent-blue);">Zense Multiplayer Rooms</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem;">Enter a room name to play with friends</p>
        <input type="text" id="roomInput" placeholder="e.g. room-alpha" style="padding:10px 14px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:white; font-size:1rem; outline:none;" />
        <button onclick="joinRoom()" style="background:var(--accent-green); color:var(--bg-main); padding:10px 20px; font-size:1rem;">Join Room</button>
    </div>

    <div class="bg-glow"></div>
    <div class="bg-pattern"></div>

    <div class="app-header">
        <div class="app-header-row">
            <div class="app-logo">
                <svg width="580" height="580" viewBox="0 0 580 580" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M70 95C83.8071 95 95 83.8071 95 70C95 56.1929 83.8071 45 70 45C56.1929 45 45 56.1929 45 70C45 83.8071 56.1929 95 70 95ZM70 140C108.66 140 140 108.66 140 70C140 31.3401 108.66 0 70 0C31.3401 0 0 31.3401 0 70C0 108.66 31.3401 140 70 140Z" fill="currentColor"/>
                </svg>
            </div>
            <h2>Zense Multiplayer Game of Life</h2>
        </div>
    </div>
    
    <div class="workspace">
        <div class="settings-card">
            <div class="settings-header">
                <span>⚙️ Configuration</span>
            </div>
            <div class="settings-grid">
                <div class="setting-item">
                    <div class="setting-label">
                        <label for="colorCountSelect">Active Colors</label>
                    </div>
                    <div class="setting-control-wrapper">
                        <select id="colorCountSelect" onchange="changeColorCount(this.value)">
                            <option value="2">2 Colors</option>
                            <option value="3">3 Colors</option>
                            <option value="4" selected>4 Colors</option>
                            <option value="6">6 Colors</option>
                            <option value="8">8 Colors</option>
                        </select>
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <label for="gridSizeSelect">Grid Dimension</label>
                    </div>
                    <div class="setting-control-wrapper">
                        <select id="gridSizeSelect" onchange="changeGridSize(this.value)">
                            <option value="40x30">40 × 30</option>
                            <option value="60x40" selected>60 × 40</option>
                            <option value="80x60">80 × 60</option>
                        </select>
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <label for="maxPerColorInput">Max Cells / Color</label>
                        <span id="maxPerColorVal" class="setting-value-badge">20</span>
                    </div>
                    <div class="setting-control-wrapper">
                        <input type="range" id="maxPerColorInput" value="20" min="1" max="200" oninput="changeMaxPerColor(this.value)">
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <label for="totalRoundsInput">Total Rounds</label>
                        <span id="totalRoundsVal" class="setting-value-badge">4</span>
                    </div>
                    <div class="setting-control-wrapper">
                        <input type="range" id="totalRoundsInput" value="4" min="1" max="25" oninput="changeTotalRounds(this.value)">
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <label for="autoTurnsInput">Auto-Play Limit</label>
                        <span id="autoTurnsVal" class="setting-value-badge">10</span>
                    </div>
                    <div class="setting-control-wrapper">
                        <input type="range" id="autoTurnsInput" value="10" min="1" max="200" oninput="updateAutoTurnsVal(this.value)">
                    </div>
                </div>

                <div class="setting-item" id="turnIndicatorBox">
                    <div class="setting-label">
                        <span>Active Turn</span>
                    </div>
                    <div class="turn-badge">
                        <span id="currentTurnColor" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-primary)"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="stats"></div>
            <div id="controls">
                <button id="startBtn" onclick="togglePlay()">Auto Play</button>
                <button id="nextTurnBtn" onclick="passTurn()">Done</button>
                <button id="clearBtn" onclick="clearGrid()">Clear</button>
                <button onclick="randomize()">Randomize</button>
                
                <div class="tools-wrapper" id="toolsWrapper">
                    <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); margin-right: 2px;">Tool:</span>
                    <button id="eraserBtn" onclick="selectEraser()" title="Eraser">🧹 Eraser</button>
                </div>
            </div>
            <canvas id="lifeCanvas"></canvas>
        </div>
    </div>

<script>
    const socket = io();
    let currentRoom = null;

    function joinRoom() {
        const inputVal = document.getElementById('roomInput').value.trim();
        if (!inputVal) {
            alert("Please enter a valid room name!");
            return;
        }
        currentRoom = inputVal;
        socket.emit('join-room', currentRoom);
        document.getElementById('room-overlay').style.display = 'none';
    }

    socket.on('init-state', (state) => {
        if (state.grid) {
            grid = state.grid;
            currentRound = state.currentRound;
            turnIndex = state.turnIndex;
            limitActive = state.limitActive;
            draw();
        }
    });

    socket.on('sync-state', (state) => {
        grid = state.grid;
        currentRound = state.currentRound;
        turnIndex = state.turnIndex;
        limitActive = state.limitActive;
        draw();
    });

    function broadcastState() {
        if (!currentRoom) return;
        socket.emit('update-state', {
            roomId: currentRoom,
            grid: grid,
            currentRound: currentRound,
            turnIndex: turnIndex,
            limitActive: limitActive
        });
    }

    const canvas = document.getElementById('lifeCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const eraserBtn = document.getElementById('eraserBtn');
    const autoTurnsInput = document.getElementById('autoTurnsInput');
    const totalRoundsInput = document.getElementById('totalRoundsInput');
    const maxPerColorInput = document.getElementById('maxPerColorInput');
    const turnIndicatorBox = document.getElementById('turnIndicatorBox');

    const CELL_SIZE = 12; 
    let COLS = 60;
    let ROWS = 40;
    
    let TOTAL_ROUNDS = 4;
    let maxPerColor = 20;
    let limitActive = true;

    const ALL_PALETTE = [
        { hex: '#26FEC3', name: 'Neon Mint' },
        { hex: '#00A6FB', name: 'Neon Sky' },
        { hex: '#FF6B35', name: 'Neon Coral' },
        { hex: '#FFBA08', name: 'Neon Yellow' },
        { hex: '#D81159', name: 'Neon Magenta' },
        { hex: '#3D348B', name: 'Neon Indigo' },
        { hex: '#25A18E', name: 'Teal Accent' },
        { hex: '#C0C1F7', name: 'Lavender Soft' }
    ];

    let numColors = 4;
    let activePalette = ALL_PALETTE.slice(0, numColors);
    
    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    let isPlaying = false;
    let intervalId = null;
    let selectedColor = activePalette[0].hex; 
    let isEraser = false;

    let currentRound = 1;
    let turnIndex = 0; 
    let turnsRemaining = 0;

    function resizeCanvasAndGrid() {
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    }

    function changeGridSize(val) {
        if (isPlaying) stopPlay();
        const parts = val.split('x');
        COLS = parseInt(parts[0]);
        ROWS = parseInt(parts[1]);
        resizeCanvasAndGrid();
        turnIndex = 0;
        currentRound = 1;
        limitActive = true;
        turnIndicatorBox.style.display = 'flex';
        buildUIElements();
        randomize();
    }

    function changeTotalRounds(val) {
        TOTAL_ROUNDS = Math.max(1, parseInt(val) || 1);
        document.getElementById('totalRoundsVal').innerText = TOTAL_ROUNDS;
        updateCounters();
        broadcastState();
    }

    function changeMaxPerColor(val) {
        maxPerColor = Math.max(1, parseInt(val) || 1);
        document.getElementById('maxPerColorVal').innerText = maxPerColor;
        updateCounters();
        broadcastState();
    }

    function updateAutoTurnsVal(val) {
        document.getElementById('autoTurnsVal').innerText = val;
    }

    function buildUIElements() {
        activePalette = ALL_PALETTE.slice(0, numColors);
        const toolsWrapper = document.getElementById('toolsWrapper');
        toolsWrapper.querySelectorAll('.color-btn').forEach(b => b.remove());

        activePalette.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 && !isEraser ? 'active' : ''}`;
            btn.setAttribute('data-color', item.hex);
            btn.style.background = item.hex;
            btn.title = item.name;
            btn.addEventListener('click', () => {
                isEraser = false;
                eraserBtn.classList.remove('active');
                toolsWrapper.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = item.hex;
            });
            toolsWrapper.insertBefore(btn, eraserBtn);
        });

        const statsDiv = document.getElementById('stats');
        statsDiv.innerHTML = '';
        activePalette.forEach(item => {
            statsDiv.innerHTML += `
                <div class="stat-item">
                    <span class="stat-dot" style="background: ${item.hex};"></span>
                    ${item.name}: <span id="count-${item.hex.replace('#','')}">0</span>${limitActive ? '/' + maxPerColor : ''}
                </div>
            `;
        });
        statsDiv.innerHTML += `<div class="stat-item">Total: <span id="count-total">0</span></div>`;
        if (limitActive) {
            statsDiv.innerHTML += `<div class="stat-item" style="color: var(--accent-amber); margin-left: 10px;">Round: <span id="roundIndicator">${currentRound}/${TOTAL_ROUNDS}</span></div>`;
        }
        updateTurnIndicator();
    }

    function updateTurnIndicator() {
        const turnSpan = document.getElementById('currentTurnColor');
        const activeColorObj = activePalette[turnIndex];
        if (turnSpan && activeColorObj) {
            turnSpan.innerHTML = `<span class="stat-dot" style="background: ${activeColorObj.hex};"></span> ${activeColorObj.name}`;
        }
    }

    function changeColorCount(val) {
        numColors = parseInt(val);
        isEraser = false;
        eraserBtn.classList.remove('active');
        turnIndex = 0;
        currentRound = 1;
        buildUIElements();
        draw();
        broadcastState();
    }

    function selectEraser() {
        isEraser = true;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        eraserBtn.classList.add('active');
    }

    function getColorCounts() {
        let counts = {};
        activePalette.forEach(p => counts[p.hex] = 0);
        let total = 0;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cell = grid[r][c];
                if (cell) {
                    total++;
                    if (counts[cell] !== undefined) counts[cell]++;
                }
            }
        }
        return { counts, total };
    }

    function updateCounters() {
        const { counts, total } = getColorCounts();
        activePalette.forEach(p => {
            const el = document.getElementById(`count-${p.hex.replace('#','')}`);
            if (el) el.innerText = counts[p.hex] || 0;
        });
        const totalEl = document.getElementById('count-total');
        if (totalEl) totalEl.innerText = total;
        const roundEl = document.getElementById('roundIndicator');
        if (roundEl) roundEl.innerText = `${currentRound}/${TOTAL_ROUNDS}`;
        updateTurnIndicator();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#001226';
        ctx.lineWidth = 0.5;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c]) {
                    ctx.fillStyle = grid[r][c];
                    ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                }
                ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }
        updateCounters();
    }

    function passTurn() {
        if (isPlaying) return; 
        turnIndex++;
        if (turnIndex >= activePalette.length) {
            turnIndex = 0;
            currentRound++;
            if (currentRound > TOTAL_ROUNDS) currentRound = 1; 
        }
        draw();
        broadcastState();
    }

    function step() {
        if (turnsRemaining <= 0) {
            stopPlay();
            return;
        }

        let nextGrid = grid.map(row => [...row]); 
        let evaluatingColor = activePalette[turnIndex].hex;
        let rawNextGrid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let parentColors = [];
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        let neighborRow = (r + i + ROWS) % ROWS;
                        let neighborCol = (c + j + COLS) % COLS;
                        if (grid[neighborRow][neighborCol]) {
                            parentColors.push(grid[neighborRow][neighborCol]);
                        }
                    }
                }

                let liveNeighbors = parentColors.length;
                if (grid[r][c] !== null) {
                    if (liveNeighbors === 2 || liveNeighbors === 3) rawNextGrid[r][c] = grid[r][c];
                } else {
                    if (liveNeighbors === 3) rawNextGrid[r][c] = parentColors[0];
                }
            }
        }

        grid = nextGrid;
        turnIndex = (turnIndex + 1) % activePalette.length;
        turnsRemaining--;
        draw();
        broadcastState();

        if (turnsRemaining <= 0) stopPlay();
    }

    function togglePlay() {
        if (isPlaying) {
            stopPlay();
        } else {
            startPlay();
        }
    }

    function startPlay() {
        isPlaying = true;
        startBtn.innerText = "Pause Auto";
        startBtn.style.background = "var(--accent-amber)";
        
        if (limitActive) {
            limitActive = false;
            turnIndicatorBox.style.display = 'none';
            buildUIElements();
        }

        turnsRemaining = parseInt(autoTurnsInput.value) || 10;
        intervalId = setInterval(step, 300);
    }

    function stopPlay() {
        isPlaying = false;
        startBtn.innerText = "Auto Play";
        startBtn.style.background = "var(--accent-green)";
        clearInterval(intervalId);
    }

    function clearGrid() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        turnIndex = 0;
        currentRound = 1;
        limitActive = true;
        turnIndicatorBox.style.display = 'flex';
        if (isPlaying) stopPlay();
        buildUIElements();
        draw();
        broadcastState();
    }

    function randomize() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        turnIndex = 0;
        currentRound = 1;
        limitActive = true;
        turnIndicatorBox.style.display = 'flex';
        buildUIElements();
        const validHexes = activePalette.map(p => p.hex);
        
        validHexes.forEach(color => {
            let placed = 0;
            while (placed < maxPerColor) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!grid[r][c]) {
                    grid[r][c] = color;
                    placed++;
                }
            }
        });
        draw();
        broadcastState();
    }

    function handleDraw(e) {
        const rect = canvas.getBoundingClientRect();
        const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
        const r = Math.floor((e.clientY - rect.top) / CELL_SIZE);
        
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
            if (e.buttons === 1) { 
                if (isEraser) {
                    grid[r][c] = null;
                } else {
                    const { counts } = getColorCounts();
                    if (grid[r][c] !== selectedColor && limitActive && counts[selectedColor] >= maxPerColor) {
                        return; 
                    }
                    grid[r][c] = selectedColor;
                }
            } else if (e.buttons === 2) { 
                grid[r][c] = null;
            }
            draw();
            broadcastState();
        }
    }

    canvas.addEventListener('mousedown', handleDraw);
    canvas.addEventListener('mousemove', handleDraw);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    buildUIElements();
    randomize();
</script>
</body>
</html>
